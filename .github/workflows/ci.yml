name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.18'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile all modules
        run: python -m compileall -q agents ui utils app.py

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately not 3.9.18: black, flake8 and isort all require >= 3.10,
      # so they cannot run on the interpreter the app deploys to. Formatting
      # is interpreter-independent, and black targets py39 via pyproject.toml.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: black --check
        run: black --check .

      - name: isort --check-only
        run: isort --check-only .

      - name: flake8
        run: flake8 .
